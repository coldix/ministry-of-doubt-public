name: Validate and build
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run case:validate
        name: Validate case data
      - run: npm run build
        name: Production build (no preview cases)
        env:
          PUBLIC_SITE_MODE: production
